name = "factory-asset-map-api"
main = "src/index.js"
compatibility_date = "2026-11-01"

[vars]
# Browser origins allowed to call the API (comma-separated). localhost is always allowed for development.
ALLOWED_ORIGINS = "https://binhfoodsafety.github.io"

[[d1_databases]]
binding = "DB"
database_name = "factory-asset-map"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

# Secret (not stored here):  npx wrangler secret put ADMIN_KEY
# Required only for "replace all data" operations (reset demo / restore backup / clear all).
