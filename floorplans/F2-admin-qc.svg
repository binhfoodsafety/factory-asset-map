<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" font-family="Arial, Helvetica, sans-serif">
  <!-- SAMPLE FLOOR PLAN - ILLUSTRATIVE DEMO ONLY. Not an actual facility, not to scale. -->
  <!-- Coordinate convention used by Factory Asset Map: origin top-left, X to the right, Y downward, 0-100 % of drawing width/height. -->
  <defs>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0H0V50" fill="none" stroke="#edf1f6" stroke-width="1"/>
    </pattern>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#e5e9f0" stroke-width="2"/>
    </pattern>
  </defs>
  <rect width="1000" height="600" fill="#ffffff"/>
  <rect width="1000" height="600" fill="url(#grid)"/>

  <!-- corridor -->
  <rect x="20" y="360" width="960" height="48" fill="#f6f8fb"/>
  <text x="500" y="389" font-size="11" fill="#a0aec0" text-anchor="middle" letter-spacing="4">CORRIDOR</text>

  <!-- furniture / benches (illustrative) -->
  <g fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5">
    <!-- laboratory benches -->
    <rect x="40" y="56" width="100" height="40" rx="3"/>
    <rect x="140" y="160" width="160" height="34" rx="3"/>
    <rect x="290" y="56" width="70" height="40" rx="3"/>
    <rect x="60" y="256" width="70" height="44" rx="3"/>
    <rect x="190" y="270" width="110" height="34" rx="3"/>
    <!-- office desks -->
    <rect x="440" y="90" width="120" height="60" rx="3"/><rect x="600" y="90" width="120" height="60" rx="3"/>
    <rect x="440" y="200" width="120" height="60" rx="3"/><rect x="600" y="200" width="120" height="60" rx="3"/>
    <!-- meeting table -->
    <ellipse cx="160" cy="492" rx="90" ry="34"/>
    <!-- canteen tables -->
    <circle cx="380" cy="470" r="20"/><circle cx="460" cy="470" r="20"/><circle cx="540" cy="470" r="20"/>
    <circle cx="380" cy="530" r="20"/><circle cx="460" cy="530" r="20"/><circle cx="540" cy="530" r="20"/>
  </g>
  <!-- spare parts shelving -->
  <g fill="url(#hatch)" stroke="#cbd5e1" stroke-width="1.5">
    <rect x="790" y="60" width="160" height="22"/><rect x="790" y="170" width="160" height="22"/><rect x="790" y="280" width="160" height="22"/>
  </g>
  <!-- stair / lift -->
  <g stroke="#94a3b8" stroke-width="1" fill="none">
    <rect x="712" y="420" width="96" height="144"/>
    <path d="M712 438H760 M712 456H760 M712 474H760 M712 492H760 M712 510H760 M712 528H760 M712 546H760"/>
    <rect x="770" y="430" width="30" height="30"/><path d="M770 430L800 460M800 430L770 460"/>
  </g>

  <!-- walls -->
  <rect x="20" y="24" width="960" height="552" fill="none" stroke="#334155" stroke-width="6"/>
  <g stroke="#475569" stroke-width="3.5" fill="none" stroke-linecap="square">
    <path d="M20 360H180 M230 360H520 M570 360H820 M870 360H980"/>
    <path d="M20 408H120 M170 408H400 M450 408H980"/>
    <path d="M400 24V360 M750 24V360"/>
    <path d="M300 408V576 M700 408V576 M820 408V576"/>
  </g>

  <!-- room labels -->
  <g font-size="13" fill="#64748b" font-weight="bold" letter-spacing="1.5">
    <text x="34" y="348">LABORATORY (QC / MICRO)</text>
    <text x="414" y="348">OFFICE</text>
    <text x="764" y="348">SPARE PARTS STORE</text>
  </g>
  <g font-size="11" fill="#94a3b8" letter-spacing="1">
    <text x="34" y="566">MEETING ROOM</text>
    <text x="314" y="566">CANTEEN</text>
    <text x="714" y="414" dy="-2">STAIR / LIFT</text>
    <text x="834" y="566">RESTROOMS</text>
  </g>

  <!-- north arrow -->
  <g transform="translate(958 384)" fill="#64748b">
    <path d="M0 -12 L6 8 L0 4 L-6 8 Z"/>
    <text x="0" y="-15" font-size="9" text-anchor="middle">N</text>
  </g>

  <!-- title -->
  <text x="20" y="15" font-size="10" fill="#64748b">DEMO COFFEE FACTORY · FLOOR 2 · QC LAB &amp; ADMINISTRATION — SAMPLE LAYOUT (ILLUSTRATIVE ONLY, NOT TO SCALE)</text>
</svg>
