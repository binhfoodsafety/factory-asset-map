<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bản đồ tài sản nhà máy</title>
  <meta name="description" content="Sơ đồ mặt bằng nhà máy tương tác để định vị, tìm kiếm và quản lý tài sản.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%230f2747'/%3E%3Cpath d='M12 19s5-4.4 5-8.5a5 5 0 1 0-10 0C7 14.6 12 19 12 19z' fill='%2338bdf8'/%3E%3Ccircle cx='12' cy='10.5' r='1.8' fill='%230f2747'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/app.css?v=1.2.1">
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22"><path d="M12 21s6-5.3 6-10.2a6 6 0 1 0-12 0C6 15.7 12 21 12 21z" fill="#38bdf8"/><circle cx="12" cy="10.8" r="2.2" fill="#0f2747"/></svg>
        </div>
        <div>
          <div class="brand-name">Bản đồ tài sản</div>
          <div class="brand-sub" id="factoryName">—</div>
        </div>
      </div>
      <nav class="nav" id="nav">
        <a href="#/dashboard" data-route="dashboard"><span class="nav-ic" data-icon="dashboard"></span><span>Dashboard</span></a>
        <a href="#/map" data-route="map"><span class="nav-ic" data-icon="map"></span><span>Sơ đồ nhà máy</span></a>
        <a href="#/register" data-route="register"><span class="nav-ic" data-icon="list"></span><span>Sổ tài sản</span></a>
        <a href="#/fa" data-route="fa"><span class="nav-ic" data-icon="wallet"></span><span>Kế toán TSCĐ</span></a>
        <a href="#/zones" data-route="zones"><span class="nav-ic" data-icon="layers"></span><span>Khu vực nhà máy</span></a>
        <a href="#/history" data-route="history"><span class="nav-ic" data-icon="history"></span><span>Lịch sử vị trí</span></a>
        <a href="#/qr" data-route="qr"><span class="nav-ic" data-icon="qr"></span><span>Mã QR</span></a>
        <a href="#/inventory" data-route="inventory"><span class="nav-ic" data-icon="clipboard"></span><span>Kiểm kê</span></a>
        <a href="#/settings" data-route="settings"><span class="nav-ic" data-icon="settings"></span><span>Cài đặt &amp; Hướng dẫn</span></a>
      </nav>
      <div class="sidebar-foot">
        <div id="syncInfo" class="sync-info small"></div>
        <div id="storageInfo" class="muted small"></div>
        <div class="muted small">v1.0</div>
      </div>
    </aside>
    <div class="sidebar-scrim" id="sidebarScrim"></div>

    <div class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menuBtn" title="Menu" aria-label="Mở menu"></button>
        <h1 class="page-title" id="pageTitle">Dashboard</h1>
        <form class="global-search" id="globalSearch" autocomplete="off">
          <span class="gs-ic" data-icon="search"></span>
          <input id="globalSearchInput" type="search" list="assetIdList" placeholder="Tìm Asset ID hoặc tên → xem trên sơ đồ" aria-label="Tìm tài sản">
          <datalist id="assetIdList"></datalist>
        </form>
        <label class="user-select" title="Tên được ghi là 'Người cập nhật' trong lịch sử vị trí (không cần đăng nhập)">
          <span class="muted small">Người thao tác</span>
          <select id="userSelect"></select>
        </label>
      </header>
      <div class="demo-banner" id="demoBanner" hidden>
        <strong>DỮ LIỆU DEMO</strong> — nhà máy, bản vẽ, tọa độ và tài sản hiển thị chỉ mang tính minh họa, không phải hồ sơ thực tế của nhà máy.
        <a href="#/settings" data-goto="data">Thay bằng dữ liệu của bạn</a>
      </div>
      <main id="views">
        <section class="view" id="view-dashboard" hidden></section>
        <section class="view view-map" id="view-map" hidden></section>
        <section class="view" id="view-register" hidden></section>
        <section class="view" id="view-fa" hidden></section>
        <section class="view" id="view-zones" hidden></section>
        <section class="view" id="view-history" hidden></section>
        <section class="view" id="view-qr" hidden></section>
        <section class="view" id="view-inventory" hidden></section>
        <section class="view" id="view-settings" hidden></section>
      </main>
    </div>
  </div>

  <div id="printArea" aria-hidden="true"></div>

  <!-- Third-party libraries (CDN). For fully offline use, see README → "Offline / intranet use". -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js" defer></script>

  <!-- Application (classic scripts so index.html also works when opened directly from disk) -->
  <script src="js/config.js?v=1.2.1" defer></script>
  <script src="js/util.js?v=1.2.1" defer></script>
  <script src="js/data/demo-data.js?v=1.2.1" defer></script>
  <script src="js/data/floorplans.js?v=1.2.1" defer></script>
  <script src="js/store.js?v=1.2.1" defer></script>
  <script src="js/finance.js?v=1.2.1" defer></script>
  <script src="js/ui.js?v=1.2.1" defer></script>
  <script src="js/print.js?v=1.2.1" defer></script>
  <script src="js/remote.js?v=1.2.1" defer></script>
  <script src="js/io.js?v=1.2.1" defer></script>
  <script src="js/views/dashboard.js?v=1.2.1" defer></script>
  <script src="js/views/map.js?v=1.2.1" defer></script>
  <script src="js/views/asset-form.js?v=1.2.1" defer></script>
  <script src="js/views/register.js?v=1.2.1" defer></script>
  <script src="js/views/zones.js?v=1.2.1" defer></script>
  <script src="js/views/history.js?v=1.2.1" defer></script>
  <script src="js/views/qr.js?v=1.2.1" defer></script>
  <script src="js/views/settings.js?v=1.2.1" defer></script>
  <script src="js/views/fixed-assets.js?v=1.2.1" defer></script>
  <script src="js/views/inventory.js?v=1.2.1" defer></script>
  <script src="js/app.js?v=1.2.1" defer></script>
</body>
</html>
