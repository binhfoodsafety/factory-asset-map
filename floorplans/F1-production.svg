<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" font-family="Arial, Helvetica, sans-serif">
  <!-- SAMPLE FLOOR PLAN - ILLUSTRATIVE DEMO ONLY. Not an actual facility, not to scale. -->
  <!-- Coordinate convention used by Factory Asset Map: origin top-left, X to the right, Y downward, 0-100 % of drawing width/height. -->
  <defs>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0H0V50" fill="none" stroke="#edf1f6" stroke-width="1"/>
    </pattern>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#e5e9f0" stroke-width="2"/>
    </pattern>
  </defs>
  <rect width="1000" height="600" fill="#ffffff"/>
  <rect width="1000" height="600" fill="url(#grid)"/>

  <!-- corridor -->
  <rect x="20" y="288" width="960" height="48" fill="#f6f8fb"/>
  <text x="500" y="317" font-size="11" fill="#a0aec0" text-anchor="middle" letter-spacing="4">MAIN CORRIDOR</text>

  <!-- equipment outlines (illustrative) -->
  <g fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5">
    <!-- Extraction: extractor columns + centrifuges -->
    <circle cx="80" cy="84" r="24"/><circle cx="160" cy="84" r="24"/><circle cx="240" cy="84" r="24"/>
    <rect x="72" y="196" width="56" height="40" rx="4"/><rect x="172" y="196" width="56" height="40" rx="4"/>
    <!-- Evaporation -->
    <rect x="335" y="60" width="50" height="70" rx="4"/>
    <circle cx="450" cy="84" r="28"/><circle cx="450" cy="204" r="28"/>
    <rect x="335" y="200" width="50" height="56" rx="4"/>
    <!-- Freeze drying -->
    <rect x="545" y="60" width="80" height="70" rx="6"/><rect x="665" y="60" width="80" height="70" rx="6"/>
    <rect x="612" y="208" width="56" height="40" rx="4"/><rect x="722" y="208" width="56" height="40" rx="4"/>
    <!-- Utility -->
    <rect x="815" y="62" width="50" height="44" rx="4"/><rect x="895" y="62" width="50" height="44" rx="4"/>
    <rect x="825" y="180" width="70" height="50" rx="4"/><rect x="912" y="206" width="56" height="44" rx="4"/>
    <!-- Packing lines -->
    <rect x="50" y="396" width="250" height="24" rx="3"/><rect x="50" y="492" width="250" height="24" rx="3"/>
    <rect x="364" y="438" width="40" height="36" rx="3"/><rect x="370" y="516" width="60" height="26" rx="3"/>
  </g>
  <!-- warehouse racking -->
  <g fill="url(#hatch)" stroke="#cbd5e1" stroke-width="1.5">
    <rect x="740" y="362" width="200" height="22"/><rect x="740" y="470" width="200" height="22"/><rect x="740" y="530" width="200" height="22"/>
  </g>
  <!-- loading docks -->
  <g fill="#e2e8f0" stroke="#64748b" stroke-width="1.5">
    <rect x="560" y="576" width="60" height="14"/><rect x="660" y="576" width="60" height="14"/>
  </g>
  <text x="590" y="597" font-size="8" fill="#64748b" text-anchor="middle">DOCK 1</text>
  <text x="690" y="597" font-size="8" fill="#64748b" text-anchor="middle">DOCK 2</text>

  <!-- walls -->
  <rect x="20" y="24" width="960" height="552" fill="none" stroke="#334155" stroke-width="6"/>
  <g stroke="#475569" stroke-width="3.5" fill="none" stroke-linecap="square">
    <path d="M20 288H120 M170 288H390 M440 288H610 M660 288H860 M910 288H980"/>
    <path d="M20 336H190 M250 336H580 M680 336H980"/>
    <path d="M300 24V288 M520 24V288 M800 24V288"/>
    <path d="M450 336V420 M450 470V576"/>
  </g>
  <!-- door swings -->
  <g stroke="#94a3b8" stroke-width="1" fill="none">
    <path d="M120 288A50 50 0 0 1 170 238"/><path d="M390 288A50 50 0 0 1 440 238"/>
    <path d="M610 288A50 50 0 0 1 660 238"/><path d="M860 288A50 50 0 0 1 910 238"/>
  </g>

  <!-- room labels -->
  <g font-size="13" fill="#64748b" font-weight="bold" letter-spacing="1.5">
    <text x="34" y="276">EXTRACTION</text>
    <text x="314" y="276">EVAPORATION</text>
    <text x="534" y="276">FREEZE DRYING</text>
    <text x="814" y="276">UTILITY</text>
    <text x="34" y="566">PACKING</text>
    <text x="464" y="566">WAREHOUSE</text>
  </g>

  <!-- north arrow -->
  <g transform="translate(958 312)" fill="#64748b">
    <path d="M0 -12 L6 8 L0 4 L-6 8 Z"/>
    <text x="0" y="-15" font-size="9" text-anchor="middle">N</text>
  </g>

  <!-- title -->
  <text x="20" y="15" font-size="10" fill="#64748b">DEMO COFFEE FACTORY · FLOOR 1 · PRODUCTION — SAMPLE LAYOUT (ILLUSTRATIVE ONLY, NOT TO SCALE)</text>
</svg>
